<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ArcFlow Orchestrator</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, #172235 0%, #0b0f14 45%, #070a0e 100%);
        color: #f8fafc;
      }

      .container {
        width: 100%;
        max-width: 820px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      .card {
        background: rgba(15, 20, 27, 0.94);
        border: 1px solid #26303d;
        border-radius: 20px;
        padding: 32px;
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .header {
        margin-bottom: 30px;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 10px;
        padding: 5px 10px;
        border: 1px solid #334155;
        border-radius: 999px;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 36px;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .subtitle {
        margin-top: 10px;
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.6;
      }

      .network {
        margin-top: 16px;
        color: #cbd5e1;
        font-size: 13px;
      }

      .network span {
        color: #f8fafc;
        font-weight: 700;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-bottom: 28px;
      }

      button {
        width: 100%;
        min-height: 46px;
        padding: 13px 16px;
        border: 1px solid #334155;
        border-radius: 10px;
        background: #18212d;
        color: #f8fafc;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          transform 0.15s ease;
      }

      button:hover:not(:disabled) {
        background: #202b3a;
        border-color: #475569;
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      #connectButton {
        background: #f8fafc;
        color: #080b10;
        border-color: #f8fafc;
      }

      #connectButton:hover:not(:disabled) {
        background: #e2e8f0;
        border-color: #e2e8f0;
      }

      #backendTestButton {
        background: transparent;
      }

      .section {
        margin-top: 22px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #cbd5e1;
        font-size: 13px;
        font-weight: 700;
      }

      input,
      select {
        width: 100%;
        min-height: 46px;
        padding: 12px 14px;
        border: 1px solid #334155;
        border-radius: 10px;
        outline: none;
        background: #0b1118;
        color: #f8fafc;
        font-size: 14px;
        transition: border-color 0.15s ease;
      }

      input:focus,
      select:focus {
        border-color: #64748b;
      }

      input::placeholder {
        color: #64748b;
      }

      input[readonly] {
        color: #94a3b8;
        background: #0d131b;
      }

      .payment-panel {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid #26303d;
      }

      #executeButton {
        margin-top: 4px;
        background: #f8fafc;
        color: #080b10;
        border-color: #f8fafc;
        font-size: 15px;
      }

      #executeButton:hover:not(:disabled) {
        background: #e2e8f0;
        border-color: #e2e8f0;
      }

      #status {
        margin-top: 24px;
        padding: 20px;
        min-height: 120px;
        border: 1px solid #26303d;
        border-radius: 12px;
        background: #0a0f15;
        color: #cbd5e1;
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
      }

      .footer {
        margin-top: 20px;
        text-align: center;
        color: #64748b;
        font-size: 12px;
      }

      @media (max-width: 600px) {
        .container {
          padding: 20px 12px;
        }

        .card {
          padding: 22px;
          border-radius: 16px;
        }

        h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <div class="header">
          <div class="eyebrow">Day 33 · ArcBuilder2026</div>

          <h1>ArcFlow Orchestrator</h1>

          <div class="subtitle">
            Agentic Payment Orchestrator on Arc Network
          </div>

          <div class="network">
            Network: <span>Arc Testnet</span>
          </div>
        </div>

        <div class="actions">
          <button id="connectButton">
            Connect MetaMask
          </button>

          <button id="backendTestButton">
            Test ArcFlow Backend
          </button>

          <button id="createAuthButton" disabled>
            Create Authorization
          </button>

          <button id="approveButton" disabled>
            Approve 1 USDC
          </button>
        </div>

        <div class="section">
          <label for="agent">Agent</label>

          <input
            id="agent"
            value="AOKAH Arc AI Agent"
            readonly
          />
        </div>

        <div class="section">
          <label for="agentId">Agent ID</label>

          <input
            id="agentId"
            value="892242"
            readonly
          />
        </div>

        <div class="payment-panel">
          <div class="section" style="margin-top: 0;">
            <label for="paymentMode">Payment Mode</label>

            <select id="paymentMode">
              <option value="authorized">
                Authorized Agent Payment
              </option>

              <option value="escrow">
                Escrow
              </option>

              <option value="direct">
                Direct Payment
              </option>
            </select>
          </div>

          <div class="section">
            <label for="recipient">Recipient</label>

            <input
              id="recipient"
              placeholder="0x..."
            />
          </div>

          <div class="section">
            <label for="amount">Amount (USDC)</label>

            <input
              id="amount"
              value="0.10"
              type="number"
              step="0.01"
              min="0"
            />
          </div>

          <div class="section">
            <button id="executeButton" disabled>
              Execute Payment
            </button>
          </div>
        </div>

        <div id="status">
          Connect MetaMask to begin.
        </div>

        <div class="footer">
          ArcFlow · Agent Authorization · On-chain Payment
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
