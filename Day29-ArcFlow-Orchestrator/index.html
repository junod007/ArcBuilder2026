<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ArcFlow Orchestrator</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0f14;
        color: #ffffff;
      }

      .container {
        max-width: 720px;
        margin: 60px auto;
        padding: 24px;
      }

      .card {
        background: #151b23;
        border: 1px solid #2a323d;
        border-radius: 16px;
        padding: 28px;
      }

      h1 {
        margin-top: 0;
      }

      .subtitle {
        color: #9ca3af;
        margin-bottom: 28px;
      }

      .section {
        margin-top: 24px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #cbd5e1;
      }

      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #0f141b;
        color: white;
        margin-bottom: 16px;
      }

      button {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 8px;
        background: #ffffff;
        color: #000000;
        font-weight: bold;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #status {
        margin-top: 24px;
        padding: 16px;
        background: #0f141b;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #cbd5e1;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h1>ArcFlow</h1>

        <div class="subtitle">
          Agentic Payment Orchestrator on Arc Network
        </div>

        <button id="connectButton">
          Connect MetaMask
        </button>

        <div class="section">
          <label>Agent</label>
          <input
            id="agent"
            value="AOKAH Arc AI Agent"
            readonly
          />
        </div>

        <div class="section">
          <label>Agent ID</label>
          <input
            id="agentId"
            value="892242"
            readonly
          />
        </div>

        <div class="section">
          <label>Payment Mode</label>

          <select id="paymentMode">
            <option value="authorized">
              Authorized Agent Payment
            </option>

            <option value="escrow">
              Escrow
            </option>

            <option value="direct">
              Direct Payment
            </option>
          </select>
        </div>

        <div class="section">
          <label>Recipient</label>

          <input
            id="recipient"
            placeholder="0x..."
          />
        </div>

        <div class="section">
          <label>Amount (USDC)</label>

          <input
            id="amount"
            value="0.10"
            type="number"
            step="0.01"
            min="0"
          />
        </div>

        <div class="section">
          <button id="executeButton" disabled>
            Execute Payment
          </button>
        </div>

        <div id="status">
          Connect MetaMask to begin.
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
